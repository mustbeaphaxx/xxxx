<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <h2>My Notes</h2>
            </div>
            
            <nav class="nav-links">
                <div class="nav-item active" onclick="loadFolder('root')">
                    <i class="fas fa-layer-group"></i> All Notes
                </div>
                <div class="nav-section-title">FOLDERS</div>
                <div id="folder-list">
                    </div>
                
                <button class="btn-new-folder" onclick="promptNewFolder()">
                    <i class="fas fa-plus"></i> New Folder
                </button>
            </nav>

            <div class="storage-info">
                <i class="fas fa-cloud"></i>
                <span>Storage</span>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs" id="breadcrumbs">
                    <span>My Notes</span> <i class="fas fa-chevron-right"></i> <span id="current-folder-name">All Notes</span>
                </div>
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search notes...">
                </div>
            </header>

            <div class="action-bar">
                <label for="file-upload" class="btn-primary">
                    <i class="fas fa-cloud-upload-alt"></i> Upload Note
                </label>
                <input type="file" id="file-upload" hidden>
                
                <div class="view-options">
                    <button class="btn-icon"><i class="fas fa-list"></i></button>
                    <button class="btn-icon active"><i class="fas fa-th-large"></i></button>
                </div>
            </div>

            <div class="files-grid" id="files-grid">
                <div class="loading">Loading your notes...</div>
            </div>
        </main>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
