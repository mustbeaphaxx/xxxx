<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-layout">
        <aside class="sidebar">
            <div class="brand">
                <div class="logo-icon"><i class="fas fa-feather-alt"></i></div>
                <h2>Notely</h2>
            </div>
            
            <button class="btn-create" onclick="triggerUpload()">
                <i class="fas fa-plus"></i> New Note
                <input type="file" id="file-upload" accept=".docx" hidden>
            </button>

            <nav class="nav-menu">
                <div class="nav-label">LIBRARY</div>
                <div class="nav-item active" id="nav-root" onclick="loadFolder('root')">
                    <i class="fas fa-th-large"></i> All Notes
                </div>
                
                <div class="nav-header">
                    <span>FOLDERS</span>
                    <button class="btn-icon-small" onclick="openModal('folder-modal')"><i class="fas fa-plus"></i></button>
                </div>
                <div id="folder-list" class="folder-list">
                    </div>
            </nav>
        </aside>

        <main class="content-area">
            <header class="header">
                <div class="page-title">
                    <h1 id="current-folder-name">All Notes</h1>
                    <span class="note-count" id="note-count">0 notes</span>
                </div>
            </header>

            <div class="notes-grid" id="files-grid">
                </div>
        </main>
    </div>

    <div id="folder-modal" class="modal-overlay">
        <div class="modal-card">
            <h3>New Folder</h3>
            <input type="text" id="new-folder-name" placeholder="e.g. Biology Notes">
            <div class="modal-actions">
                <button class="btn-text" onclick="closeModal('folder-modal')">Cancel</button>
                <button class="btn-primary" onclick="createFolder()">Create</button>
            </div>
        </div>
    </div>

    <div id="note-viewer-modal" class="modal-overlay">
        <div class="reader-card">
            <div class="reader-header">
                <h2 id="viewer-title">Untitled Note</h2>
                <button class="btn-close" onclick="closeModal('note-viewer-modal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="reader-body" id="viewer-content">
                </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
