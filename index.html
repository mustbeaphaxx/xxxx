<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-book-open"></i>
                <h2>My Notes</h2>
            </div>
            
            <nav class="nav-links">
                <div class="nav-item active" id="nav-root" onclick="loadFolder('root')">
                    <i class="fas fa-layer-group"></i> All Notes
                </div>
                
                <div class="nav-section-title">FOLDERS</div>
                <div id="folder-list">
                    </div>
                
                <button class="btn-new-folder" onclick="openModal()">
                    <i class="fas fa-plus"></i> New Folder
                </button>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="crumb-muted">My Notes</span>
                    <i class="fas fa-chevron-right crumb-separator"></i>
                    <span id="current-folder-name" class="crumb-active">All Notes</span>
                </div>
                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search notes...">
                </div>
            </header>

            <div class="action-bar">
                <label for="file-upload" class="btn-primary" id="upload-btn">
                    <i class="fas fa-cloud-upload-alt"></i> Upload Note
                </label>
                <input type="file" id="file-upload" hidden>
            </div>

            <div class="files-grid" id="files-grid">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading your notes...</p>
                </div>
            </div>
        </main>
    </div>

    <div id="folder-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Create New Folder</h3>
            <input type="text" id="new-folder-name" placeholder="Folder Name (e.g. Biology)">
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn-primary" onclick="createFolder()">Create</button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
