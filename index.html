<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-book-open"></i>
                <h2>My Notes</h2>
            </div>
            <nav class="nav-links">
                <div class="nav-item active" id="nav-root" onclick="loadFolder('root')">
                    <i class="fas fa-layer-group"></i> All Notes
                </div>
                <div class="nav-section-title">FOLDERS</div>
                <div id="folder-list"></div>
                <button class="btn-new-folder" onclick="openModal('folder-modal')">
                    <i class="fas fa-plus"></i> New Folder
                </button>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="crumb-muted">My Notes</span>
                    <i class="fas fa-chevron-right crumb-separator"></i>
                    <span id="current-folder-name" class="crumb-active">All Notes</span>
                </div>
            </header>

            <div class="action-bar">
                <label for="file-upload" class="btn-primary" id="upload-btn">
                    <i class="fas fa-magic"></i> Convert Doc to Note
                </label>
                <input type="file" id="file-upload" accept=".docx" hidden>
            </div>

            <div class="files-grid" id="files-grid">
                </div>
        </main>
    </div>

    <div id="folder-modal" class="modal-overlay">
        <div class="modal-content small-modal">
            <h3>Create New Folder</h3>
            <input type="text" id="new-folder-name" placeholder="Folder Name">
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal('folder-modal')">Cancel</button>
                <button class="btn-primary" onclick="createFolder()">Create</button>
            </div>
        </div>
    </div>

    <div id="note-viewer-modal" class="modal-overlay">
        <div class="modal-content large-modal">
            <div class="note-header">
                <h2 id="viewer-title">Note Title</h2>
                <button class="btn-icon" onclick="closeModal('note-viewer-modal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="note-body" id="viewer-content">
                </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
